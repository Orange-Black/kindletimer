<!DOCTYPE html>
<html lang="zh">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>泡面神器</title>
    <style>
        @font-face {
            font-family: 'Ubuntu';
            src: url('src/Ubuntu-R.woff2') format('woff2'),
                 url('src/Ubuntu-R.woff') format('woff');
        }
        /* 整行（含两个数字之间的冒号）统一用 Ubuntu，
           冒号是 <strong> 之间的裸文本节点，只写 #RemainM/#RemainS 会漏掉它 */
        .clock {
            font-family: 'Ubuntu', sans-serif;
        }
        #RemainM,#RemainS {
            font-family: 'Ubuntu', sans-serif;
        }
        /* 所有尺寸都以 body 字号为基准（1em = 16px 时即原始设计），
           再让 body 字号跟随视口宽度缩放，整页等比放大/缩小。
           先写 16px 兜底：不支持 vw 的老浏览器得到与原来完全一致的尺寸。 */
        body      { font-size: 16px; font-size: 2.6667vw; }
        .title    { font-size: 3em; }
        .clock    { font-size: 10.7em; }
        .subtitle { font-size: 2em; }
        .btn, .btn-lg { text-align: center; font-size: 2em; height: 2.5em; }
        .btn    { width: 4.625em; }
        .btn-lg { width: 9.375em; }

        /* 横屏时高度才是瓶颈（整页高约 37em），改按视口高度缩放 */
        @media (orientation: landscape) {
            body { font-size: 16px; font-size: 2.3vh; }
        }
    </style>
    <script type="application/javascript">
        var countdown=240;
        function timeDisp(countdown){
            var nM=Math.floor(countdown/60);//分
            if(nM<10) nM="0"+nM;
            var nS=Math.floor(countdown) % 60;//秒
            if(nS<10) nS="0"+nS;
            document.getElementById("RemainM").innerHTML=nM;
            document.getElementById("RemainS").innerHTML=nS;
        }
        function changetime(changeTimeVal){
            countdown=countdown+changeTimeVal;
            if (countdown<0) countdown=0;
            timeDisp(countdown);
        }
        function settime(val) {
            //停止倒计时
            if (countdown == 0) {
                val.removeAttribute("disabled");
                val.value="再来一碗！";
                // 弹窗提醒
                alert("可以吃了!");

            } else {
                //倒计时
                val.setAttribute("disabled", true);
                val.value="请耐心等待";
                countdown--;

                timeDisp(countdown);

                setTimeout(function() {
                    settime(val)
                },1000)
            }
        }
    </script>
</head>

<body style="text-align: center;">
<br> <br> <br>

<div>
    <div>
        <span class="title">盖Kindle，面更香</span>
        </div>
</div>

<br> <br>

<div class="subtitle">
    <div>
        剩余时间
    </div>
</div>

<div class="clock">
    <div>
        <strong id="RemainM">04</strong>:<strong id="RemainS">00</strong>
    </div>
</div>

<div>
    <div>
        <input type="button" class="btn" value="+10s" onclick="changetime(+10)" />
        <input type="button" class="btn" value="-10s" onclick="changetime(-10)" />
    </div>
</div>
<br>
<div>
    <div>
        <input type="button" class="btn-lg" value="开始泡面" onclick="settime(this)" />
    </div>
</div>
</body>

</html>
