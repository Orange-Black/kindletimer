<!DOCTYPE html>
<html lang="zh">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>泡面神器</title>
    <style>
        @font-face {
            font-family: 'Ubuntu';
            src: url('src/Ubuntu-R.woff2') format('woff2'),
                 url('src/Ubuntu-R.woff') format('woff');
        }
        #RemainM,#RemainS {
            font-family: 'Ubuntu', sans-serif;
        }
        /* 自适应尺寸：窄屏按视口宽度等比缩放，600px 以上保持原始大小 */
        .title    { font-size: 8vw; }
        .clock    { font-size: 28.5vw; }
        .subtitle { font-size: 5.4vw; }
        .btn, .btn-lg { text-align: center; font-size: 5.4vw; height: 13.4vw; }
        .btn    { width: 24.7vw; }
        .btn-lg { width: 50vw; }
        @media (min-width: 600px) {
            .title    { font-size: 3em; }
            .clock    { font-size: 10.7em; }
            .subtitle { font-size: 2em; }
            .btn, .btn-lg { font-size: 2em; height: 80px; }
            .btn    { width: 148px; }
            .btn-lg { width: 300px; }
        }
    </style>
    <script type="application/javascript">
        var countdown=240;
        function timeDisp(countdown){
            var nM=Math.floor(countdown/60);//分
            if(nM<10) nM="0"+nM;
            var nS=Math.floor(countdown) % 60;//秒
            if(nS<10) nS="0"+nS;
            document.getElementById("RemainM").innerHTML=nM;
            document.getElementById("RemainS").innerHTML=nS;
        }
        function changetime(changeTimeVal){
            countdown=countdown+changeTimeVal;
            if (countdown<0) countdown=0;
            timeDisp(countdown);
        }
        function settime(val) {
            //停止倒计时
            if (countdown == 0) {
                val.removeAttribute("disabled");
                val.value="再来一碗！";
                // 弹窗提醒
                alert("可以吃了!");

            } else {
                //倒计时
                val.setAttribute("disabled", true);
                val.value="请耐心等待";
                countdown--;

                timeDisp(countdown);

                setTimeout(function() {
                    settime(val)
                },1000)
            }
        }
    </script>
</head>

<body style="text-align: center;">
<br> <br> <br>

<div>
    <div>
        <span class="title">盖Kindle，面更香</span>
        </div>
</div>

<br> <br>

<div class="subtitle">
    <div>
        剩余时间
    </div>
</div>

<div class="clock">
    <div>
        <strong id="RemainM">04</strong>:<strong id="RemainS">00</strong>
    </div>
</div>

<div>
    <div>
        <input type="button" class="btn" value="+10s" onclick="changetime(+10)" />
        <input type="button" class="btn" value="-10s" onclick="changetime(-10)" />
    </div>
</div>
<br>
<div>
    <div>
        <input type="button" class="btn-lg" value="开始泡面" onclick="settime(this)" />
    </div>
</div>
</body>

</html>
